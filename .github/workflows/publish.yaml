name: Build and Publish NPM Package

permissions:
  contents: read
  packages: write
  id-token: write
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm and Node
        uses: pnpm/setup@v2
        with:
          version: 11
          cache: true
          runtime: node@24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm and Node
        uses: pnpm/setup@v2
        with:
          version: 11
          cache: true
          runtime: node@24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Execute pre-commit
        run: pnpm exec prek --all-files

  build-and-publish:
    runs-on: ubuntu-latest
    needs: [pre-commit, build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 11
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@austinlongmn'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build

      - name: Publish to package registry
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
