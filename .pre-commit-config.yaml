repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: pnpm-lock\.yaml$
      - id: check-json
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: frontend-lint
        name: lint
        entry: pnpm run lint
        language: system
        files: \.(js|ts|jsx|tsx)$
        pass_filenames: false
      - id: frontend-format
        name: format
        entry: pnpm run format
        language: system
        files: \.(js|ts|jsx|tsx)$
        pass_filenames: false
